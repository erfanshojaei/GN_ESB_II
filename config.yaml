# List of camera IP addresses
camera_ips:
  - 169.254.207.1  # Camera 1
  - 169.254.207.2  # Camera 2

# PLC variable names
plc_variables:
  run_program: run_program  # Start planting operation
  exit_script: exit_script  # Exit the program
  session_number: sessionNumber  # Current session number
  tree_vertical: tree_vertical  # Status when tree is vertical
  tree_non_vertical: tree_non_vertical  # Status when tree is not vertical
  set_vry_low_acc: set_vry_low_acc  # Very low accuracy level
  set_low_acc: set_low_acc  # Low accuracy level
  set_nrml_acc: set_nrml_acc  # Normal accuracy level
  set_hgh_acc: set_hgh_acc  # High accuracy level
  set_vry_hgh_acc: set_vry_hgh_acc  # Very high accuracy level

# Maximum allowable session number before resetting
max_session_number: 5
